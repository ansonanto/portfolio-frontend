kind = "web"
previewPath = "/portfolio/"
title = "Anson Antony — Portfolio"
version = "1.0.0"
id = "frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/portfolio/" ]
localPort = 21113

[services.development]
run = "npm run dev -w @workspace/portfolio"

[services.production]
build = [ "npm", "run", "build", "-w", "@workspace/portfolio" ]
publicDir = "frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/portfolio/"
